kind = "mobile"
previewPath = "/"
title = "অগ্রহায়ণ"
description = "অগ্রহায়ণ is a friendly Bangla-first expense, income, budget, and motivation app for people in Bangladesh and beyond."
version = "1.0.0"
id = "artifacts/mobile-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24382

[services.development]
run = "pnpm --filter @workspace/mobile-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile-app", "run", "serve" ]

[services.env]
PORT = "24382"
BASE_PATH = "/"
